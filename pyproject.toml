[project]
name = "contvision"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<=3.13"
dependencies = [
    "jiwer>=4.0.0",
    "matplotlib>=3.11.2",
    "opencv-python==4.10.0.84",
    "paddleocr>=3.7.0",
    "paddlepaddle>=3.3.1",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "streamlit>=1.67.0",
    "torch>=2.15.0",
    "transformers>=5.23.0",
    "ultralytics>=8.4.212",
]

[project.scripts]
contvision = "contvision:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
constraint-dependencies = [
    "opencv-contrib-python==4.10.0.84",
]
